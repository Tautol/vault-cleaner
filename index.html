<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault-Cleaner | Markdown Optimizer</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-color: #2a2a2a;
            --text-color: #dcddde;
            --accent-color: #7b61ff;
            --accent-hover: #9582ff;
            --border-color: #3e3e3e;
            --input-bg: #161616;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 1rem 2rem;
            background-color: var(--panel-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            gap: 1rem;
        }

        textarea {
            flex: 1;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            font-family: 'Fira Code', 'Cascadia Code', 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        .toolbar {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            justify-content: center;
            padding-bottom: 1rem;
        }

        button {
            background-color: var(--panel-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        button:hover {
            background-color: var(--border-color);
            border-color: var(--text-color);
        }

        button.primary {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: white;
        }

        button.primary:hover {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .status-bar {
            padding: 0.5rem 2rem;
            background-color: var(--panel-color);
            border-top: 1px solid var(--border-color);
            font-size: 0.75rem;
            color: #888;
            display: flex;
            justify-content: space-between;
        }

        .toast {
            position: fixed;
            bottom: 3rem;
            right: 2rem;
            background: var(--accent-color);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Vault-Cleaner <span style="font-weight: 300; opacity: 0.6;">MVP</span></h1>
        <div style="font-size: 0.8rem; opacity: 0.5;">Client-side Markdown Optimizer</div>
    </header>

    <div class="main-container">
        <div class="editor-area">
            <textarea id="markdown-input" placeholder="Paste your Markdown here..."></textarea>
            
            <div class="toolbar">
                <button onclick="cleanNotion()">Clean Notion Artifacts</button>
                <button onclick="standardizeTags()">Standardize Tags</button>
                <button onclick="convertLinks()">Relative Link Converter</button>
                <div style="width: 1px; background: var(--border-color); margin: 0 0.5rem;"></div>
                <button class="primary" onclick="copyToClipboard()">Copy to Clipboard</button>
                <button class="primary" onclick="downloadMd()">Download .md</button>
            </div>
        </div>
    </div>

    <div class="status-bar">
        <div id="char-count">Characters: 0</div>
        <div>Local Execution Only</div>
    </div>

    <div id="toast" class="toast">Copied!</div>

    <script>
        const input = document.getElementById('markdown-input');
        const charCount = document.getElementById('char-count');
        const toast = document.getElementById('toast');

        // Update character count on input
        input.addEventListener('input', () => {
            charCount.textContent = `Characters: ${input.value.length}`;
        });

        function showToast(message) {
            toast.textContent = message;
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2000);
        }

        function cleanNotion() {
            let text = input.value;
            // Remove Notion UUIDs: 8-4-4-4-12 hex chars
            const uuidRegex = /[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}/gi;
            text = text.replace(uuidRegex, '');
            
            // Remove common Notion redundant patterns (e.g. double brackets if any, or specific Notion export markers)
            // This can be expanded as more artifacts are discovered
            
            input.value = text.trim();
            showToast('Notion artifacts cleaned');
        }

        function standardizeTags() {
            let text = input.value;
            // Find #tags (alphanumeric) and convert to lowercase
            text = text.replace(/#\w+/g, (match) => match.toLowerCase());
            input.value = text;
            showToast('Tags standardized');
        }

        function convertLinks() {
            let text = input.value;
            // Replace /Users/[any]/Vault/ with ./
            // This matches the pattern provided: /Users/username/Vault/
            const pathRegex = /\/Users\/[^/]+\/Vault\//g;
            text = text.replace(pathRegex, './');
            input.value = text;
            showToast('Links converted to relative');
        }

        async function copyToClipboard() {
            try {
                await navigator.clipboard.writeText(input.value);
                showToast('Copied to clipboard!');
            } catch (err) {
                console.error('Failed to copy: ', err);
                showToast('Error copying text');
            }
        }

        function downloadMd() {
            const text = input.value;
            if (!text) {
                showToast('Nothing to download');
                return;
            }
            const blob = new Blob([text], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'cleaned-vault-note.md';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('Downloading file...');
        }
    </script>
</body>
</html>
